name: Prop Seed Holding v4.0
on:
  workflow_dispatch:
  push:
    branches: [research/mtf-crossasset-v1-3]
    paths:
      - 'research/prop_seed_holding_v40.py'
      - '.github/workflows/prop-seed-holding-v40.yml'

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: pip install pandas numpy requests yfinance tabulate
      - run: npm install -g dukascopy-node
      - name: Run prop seed holding comparison
        shell: bash
        run: |
          set -o pipefail
          python research/prop_seed_holding_v40.py | tee prop-seed-holding-v40.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prop-seed-holding-v40
          path: |
            research/results/prop_seed_holding_v40/
            prop-seed-holding-v40.txt
          retention-days: 30
