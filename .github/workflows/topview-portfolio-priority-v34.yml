name: TopView Portfolio Priority v3.4

on:
  push:
    branches:
      - research/mtf-crossasset-v1-3
    paths:
      - research/topview_portfolio_priority_v34.py
      - research/topview_sector_stock_10y_v33.py
      - .github/workflows/topview-portfolio-priority-v34.yml
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas numpy yfinance
      - name: Run portfolio validation
        run: python research/topview_portfolio_priority_v34.py | tee topview-portfolio-priority-v34.txt
      - uses: actions/upload-artifact@v4
        with:
          name: topview-portfolio-priority-v34-results
          path: |
            research/results/topview_portfolio_priority_v34/
            topview-portfolio-priority-v34.txt
          retention-days: 30
