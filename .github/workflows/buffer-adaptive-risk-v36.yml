name: Buffer Adaptive Risk v3.6

on:
  push:
    branches:
      - research/mtf-crossasset-v1-3
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas numpy yfinance
      - name: Run buffer adaptive risk v3.6
        run: python research/buffer_adaptive_risk_v36.py | tee buffer-adaptive-risk-v36.txt
      - uses: actions/upload-artifact@v4
        with:
          name: buffer-adaptive-risk-v36-results
          path: |
            research/results/buffer_adaptive_risk_v36/
            buffer-adaptive-risk-v36.txt
          retention-days: 30
