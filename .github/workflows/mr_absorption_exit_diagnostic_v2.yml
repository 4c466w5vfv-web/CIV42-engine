name: ARK42 MR Absorption Exit Diagnostic v2

on:
  push:
    branches:
      - backtest/ndx-trend-pilot
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pandas
        run: python -m pip install --disable-pip-version-check pandas
      - name: Run absorption + exit diagnostic
        run: python research/trading/mr_absorption_exit_diagnostic_v2.py
