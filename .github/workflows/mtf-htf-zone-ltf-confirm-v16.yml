name: MTF HTF Zone LTF Confirm v1.6

on:
  push:
    branches:
      - research/mtf-crossasset-v1-3
    paths:
      - research/mtf_htf_zone_ltf_confirm_v16.py
      - .github/workflows/mtf-htf-zone-ltf-confirm-v16.yml
  workflow_dispatch:

jobs:
  backtest:
    strategy:
      fail-fast: false
      matrix:
        asset: [ETH, BTC, GOLD, NQ_PROXY, SP500_PROXY, NATGAS, USTBOND, WTI, COPPER, SILVER]
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          pip install pandas numpy requests yfinance tabulate
          npm install dukascopy-cli
      - name: Run ${{ matrix.asset }}
        env:
          ASSET: ${{ matrix.asset }}
        run: python research/mtf_htf_zone_ltf_confirm_v16.py | tee ${{ matrix.asset }}-v16.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mtf-v16-${{ matrix.asset }}
          path: |
            research/results/mtf_v16/${{ matrix.asset }}/
            ${{ matrix.asset }}-v16.txt
          retention-days: 30
