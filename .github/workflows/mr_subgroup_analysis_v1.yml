name: ARK42 MR Subgroup Diagnostic v1

on:
  push:
    branches: [backtest/ndx-trend-pilot]
    paths:
      - 'research/trading/mr_subgroup_analysis_v1.py'
      - '.github/workflows/mr_subgroup_analysis_v1.yml'
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pandas
        run: python -m pip install --disable-pip-version-check pandas
      - name: Run subgroup diagnostic
        run: python research/trading/mr_subgroup_analysis_v1.py
