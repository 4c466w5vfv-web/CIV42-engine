name: Trading Guard v1

on:
  push:
    branches: [research/mtf-crossasset-v1-3]
    paths:
      - 'trading_guard/**'
      - 'tests/test_trading_guard_v1.py'
      - '.github/workflows/trading-guard-v1.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      - run: pytest -q tests/test_trading_guard_v1.py
