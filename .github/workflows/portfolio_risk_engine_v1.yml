name: ARK42 Portfolio Risk Engine v1

on:
  push:
    branches:
      - backtest/ndx-trend-pilot
  workflow_dispatch:

jobs:
  risk-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic risk-engine tests
        run: python research/trading/portfolio_risk_engine_v1.py
