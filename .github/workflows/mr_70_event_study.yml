name: ARK42 MR 70 Event Study

on:
  push:
    branches:
      - backtest/ndx-trend-pilot
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pandas
        run: python -m pip install --disable-pip-version-check pandas
      - name: Run MR 70 event study
        run: python research/trading/mr_70_event_study.py
